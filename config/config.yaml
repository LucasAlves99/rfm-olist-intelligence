# config/config.yaml
# Parâmetros centralizados do projeto RFM Olist
# Altere aqui — nunca hardcode nos scripts/notebooks

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  powerbi_output: "data/powerbi"
  models: "models"

rfm:
  snapshot_date: "2018-09-04"        # Data fixa para reprodutibilidade
  status_filter: "delivered"
  q_score: 5                          # Quintis para R/F/M scores

clustering:
  k_clusters: 4
  random_state: 42
  n_init: 10
  features:
    - "Recency"
    - "Frequency_log"
    - "Monetary_log"

export:
  encoding: "utf-8-sig"              # BOM para Power BI / Excel
  date_format: "%Y-%m-%d"
  decimal_places: 2

viz:
  sample_size: 5000                  # Amostra para scatter plots
  percentile_outlier_cap: 0.99       # Corte de outliers nos histogramas
  alpha_significance: 0.05           # Nível de significância estatística
  random_state: 42
