[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-transcriber"
version = "0.1.0"
description = "Transcreve vídeos do YouTube: legendas oficiais primeiro, Whisper como plano B."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["youtube-transcript-api>=1.0,<2", "requests>=2.28"]

[project.optional-dependencies]
whisper = ["yt-dlp>=2025.1.1", "faster-whisper>=1.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
yt-transcribe = "yt_transcriber.cli:main"

[tool.setuptools]
packages = ["yt_transcriber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
